name: Selenium ikuuu cookies

on:
  schedule:
    # UTC 19:01 = 北京时间 03:01
    # 避开整点高峰以减少延迟
    - cron: '01 19 * * *'
  workflow_dispatch:

env:
  RUN_ENV: prod
  PYTHONUNBUFFERED: '1'
  TZ: Asia/Shanghai

jobs:
  selenium:
    runs-on: ubuntu-24.04

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v6

      # Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # 定时任务随机延迟 10~300 秒
      - name: Random delay (schedule only)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 291 + 10))

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 如果需要手动安装 Chrome，可以启用下面的步骤
      #
      # - name: Setup Chrome
      #   uses: browser-actions/setup-chrome@v1
      #   with:
      #     chrome-version: 147

      # 执行 Selenium
      - name: Run Selenium script
        env:
          SOME_SECRET: ${{ secrets.SOME_SECRET }}
          SCKEY: ${{ secrets.SCKEY }}
          CONFIG: ${{ secrets.CONFIG }}
          DINGDINGWEBHOOK: ${{ secrets.DINGDINGWEBHOOK }}
          DINGDINGSECRET: ${{ secrets.DINGDINGSECRET }}
          G_ID: ${{ secrets.G_ID }}
          G_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          python your_script.py

      # 无论前面成功还是失败，都上传截图
      - name: Upload Selenium screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: selenium-screenshotstemp
          path: |
            screenshotstemp/**
          retention-days: 7
          if-no-files-found: warn